apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-registration
spec:
  replicas: 2
  selector:
    matchLabels: {app: devops-registration}
  template:
    metadata:
      labels: {app: devops-registration}
    spec:
      containers:
        - name: flask
          image: devops-registration:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /register, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
