<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Simple JavaScript Program</title></head><body>
<p id="output">0</p><button id="increment-button">Increment</button>
<script>let count = 0; document.getElementById('increment-button').addEventListener('click', () => {document.getElementById('output').textContent = String(++count);});</script>
</body></html>
